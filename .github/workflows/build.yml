name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout your Android project
      - name: Checkout Android project
        uses: actions/checkout@v4

      # ProtoHax core requires Java 11
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Download the ProtoHax core that the Android project depends on
      - name: Checkout ProtoHax core
        uses: actions/checkout@v4
        with:
          repository: hax0r31337/ProtoHax
          ref: stable
          path: ProtoHax-core
          submodules: recursive

      # Build and install ProtoHax 1.4.0 into Maven Local
      - name: Publish ProtoHax 1.4.0 to Maven Local
        working-directory: ProtoHax-core
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      # Android Gradle Plugin requires Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build the APK
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Make the APK available in the Actions run
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
