name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout ProtoHax core
        uses: actions/checkout@v4
        with:
          repository: hax0r31337/ProtoHax
          ref: stable
          path: ProtoHax-core

      - name: Publish ProtoHax to Maven Local
        working-directory: ProtoHax-core
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
